/* Layout: one phone-sized app with five tabs and bottom sheets; on wide screens a short demo guide sits beside it. */
:root{
  --ink:#14213a;--ink-2:#55617a;--ink-3:#566279;
  --ground:#eef1f6;--surface:#fff;--raised:#f5f7fb;--line:#dfe4ed;
  --brand:#0b3c8c;--brand-ink:#fff;--brand-soft:#e4ecfa;--brand-text:#0b3c8c;--marigold:#f5a524;--on-marigold:#2a1b00;
  --good:#12703f;--good-bg:#e0f4e8;--warn:#8a5600;--warn-bg:#fdf0d3;--bad:#b3261e;--bad-bg:#fbe5e3;--info:#44506a;--info-bg:#e9ecf3;
  --band:#0b2f6e;--band-2:#c9d7f2;--bar:#2f66c6;--bar-dim:#a9c0e8;--bar2:#e08a00;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#eaf0fb;--ink-2:#aeb9cf;--ink-3:#aeb9cf;
  --ground:#0b111d;--surface:#141c2c;--raised:#1c2639;--line:#2b3750;
  --brand:#8db4f7;--brand-ink:#0b1a33;--brand-soft:#1f3257;--brand-text:#a9c7fa;--marigold:#f5b041;--on-marigold:#2a1b00;
  --good:#6fdc9d;--good-bg:#12331f;--warn:#f3c56b;--warn-bg:#3a2b0c;--bad:#ff9a92;--bad-bg:#401a18;--info:#b9c3d8;--info-bg:#263149;
  --band:#10264f;--band-2:#b5c7ea;--bar:#3987e5;--bar-dim:#2c4a78;--bar2:#c77700;color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#eaf0fb;--ink-2:#aeb9cf;--ink-3:#aeb9cf;
  --ground:#0b111d;--surface:#141c2c;--raised:#1c2639;--line:#2b3750;
  --brand:#8db4f7;--brand-ink:#0b1a33;--brand-soft:#1f3257;--brand-text:#a9c7fa;--marigold:#f5b041;--on-marigold:#2a1b00;
  --good:#6fdc9d;--good-bg:#12331f;--warn:#f3c56b;--warn-bg:#3a2b0c;--bad:#ff9a92;--bad-bg:#401a18;--info:#b9c3d8;--info-bg:#263149;
  --band:#10264f;--band-2:#b5c7ea;--bar:#3987e5;--bar-dim:#2c4a78;--bar2:#c77700;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.45 var(--font);font-variant-numeric:tabular-nums;display:flex;justify-content:center;align-items:center;gap:40px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{position:relative;width:100%;height:100%;background:var(--ground);display:flex;flex-direction:column;overflow:hidden}
.status{display:none}.indicator{display:none}.device{width:100%;height:100%}.wrap{width:100%;height:100%;flex:none}.btns{display:none}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){
 :root{--home-pad:22px}
 .wrap{position:relative;width:410px;height:864px}
 .device{position:absolute;left:0;top:0;width:410px;height:864px;padding:10px;background:#11151d;border-radius:58px;box-shadow:0 0 0 2px #3a4150,0 30px 70px rgba(10,30,70,.32);transform-origin:top left}
 .device[data-frame="android"]{border-radius:40px}
 .btns{display:block;position:absolute;right:-3px;top:190px;width:3px;height:90px;background:#3a4150;border-radius:0 2px 2px 0;box-shadow:0 110px 0 #3a4150}
 .app{height:100%;border-radius:48px}
 .device[data-frame="android"] .app{border-radius:30px}
 .status{display:flex;position:relative;height:50px;flex:none;align-items:center;justify-content:space-between;padding:8px 28px 0;font-weight:700;font-size:15px;color:var(--ink);background:var(--ground)}
 .status svg{height:12px;width:auto;fill:currentColor;display:block}
 .status .sig{display:flex;gap:6px;align-items:center}
 .status::after{content:"";position:absolute;left:50%;top:11px;width:118px;height:32px;margin-left:-59px;border-radius:20px;background:#000}
 .device[data-frame="android"] .status::after{width:16px;height:16px;margin-left:-8px;top:17px}
 .device[data-frame="android"] .status{padding:8px 20px 0;font-size:13.5px}
 .indicator{display:block;position:absolute;left:50%;bottom:7px;width:130px;height:5px;margin-left:-65px;border-radius:3px;background:var(--ink);z-index:50;pointer-events:none}
 .device[data-frame="android"] .indicator{width:100px;height:4px;margin-left:-50px;opacity:.6}
}
.app[data-tab="home"] .status,.app[data-tab="home"] .strip,.app[data-tab="crm"] .status,.app[data-tab="crm"] .strip{background:var(--band);color:#fff}
.app[data-tab="home"] .strip,.app[data-tab="crm"] .strip{color:var(--band-2)}
.view,.sheet,.drawer{scrollbar-width:none}.view::-webkit-scrollbar,.sheet::-webkit-scrollbar,.drawer::-webkit-scrollbar{display:none}
.app{user-select:none;-webkit-tap-highlight-color:transparent}.kv b,input{user-select:text}
button{transition:transform .08s,opacity .08s}button:active:not([disabled]){transform:scale(.97);opacity:.85}
.enter{animation:fade .18s ease-out}@keyframes fade{from{opacity:.2;transform:translateY(4px)}}
.burger{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;flex:none}
.band .burger{color:#fff;background:rgba(255,255,255,.12)}.bar .burger{background:var(--surface);color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;background:var(--ground);justify-content:flex-start}.bar h1{flex:1;min-width:0}
.bell.lite{background:var(--surface);color:var(--ink)}
.drawer{position:absolute;left:0;top:0;bottom:0;width:84%;max-width:330px;background:var(--surface);overflow-y:auto;display:flex;flex-direction:column;animation:slide .2s ease-out;padding-bottom:calc(24px + var(--home-pad,0px))}
@keyframes slide{from{transform:translateX(-100%)}}
.d-head{background:var(--band);color:#fff;padding:18px 16px;display:flex;gap:12px;align-items:center;width:100%}
.d-head .ava{width:52px;height:52px;font-size:19px}.d-head b{font-size:22px;font-weight:800;display:block;line-height:1.1}.d-head small{color:var(--band-2);font-size:12.5px;display:block}
.d-sec{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:14px 16px 4px}
.d-item{display:flex;align-items:center;gap:13px;width:100%;padding:11px 16px;font-weight:600}.d-item svg{color:var(--brand-text);flex:none}
.d-item:hover{background:var(--raised)}.d-item em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;background:var(--warn-bg);color:var(--warn);padding:1px 8px;border-radius:99px}
.backdrop.pg{background:var(--surface)}
.sheet.pg{inset:0;max-height:none;border-radius:0;animation:push .2s ease-out;padding-bottom:calc(20px + var(--home-pad,0px))}
@keyframes push{from{transform:translateX(30px);opacity:.4}}
.sheet.pg .sheet-h{justify-content:flex-start;position:sticky;top:-10px;background:var(--surface);z-index:2;padding-block:4px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center;flex:none}
.sheet{padding-bottom:calc(20px + var(--home-pad,0px))}

/* Reads a spoken or scanned sentence into customer details. Runs in the page, no server. */
function parseEntry(text){
  let t=" "+String(text||"").replace(/[₹]/g," rs ")+" ";const out={name:"",phone:"",amt:0,when:""};
  const ph=t.match(/(?:\+?91[\s-]*)?\b([6-9](?:[\s-]?\d){9})\b/);
  if(ph){out.phone=ph[1].replace(/\D/g,"");t=t.replace(ph[0]," ")}
  const W=/end\s+of\s+(?:the\s+)?month|month[\s-]*end|mahine\s+ke\s+(?:end|ant|aakhir)(?:\s+(?:tak|me|mein))?/i;
  if(W.test(t)){out.when="eom";t=t.replace(W," ")}else if(/\b(right now|now|today|immediately|abhi|aaj)\b/i.test(t))out.when="now";
  const num=(n,u)=>{let v=parseFloat(n.replace(/,/g,""));if(u){u=u.toLowerCase();v*=/lakh/.test(u)?1e5:1e3}return Math.round(v*100)};
  const N="(\\d[\\d,]*(?:\\.\\d{1,2})?)(?:\\s*(thousand|hazar|hajar|lakh|k)\\b)?";
  const pats=[new RegExp("(?:rs\\.?|inr|rupees?)\\s*:?\\s*"+N,"i"),new RegExp(N+"\\s*(?:rs\\b\\.?|rupees?|rupaye|inr)","i"),new RegExp("(?:owes?|due|amount|balance|baki|baaki|udhaar|udhar|collect|total)\\s*(?:of|is|:|-)?\\s*"+N,"i"),new RegExp("\\b"+N,"i")];
  for(const p of pats){const m=t.match(p);if(m){out.amt=num(m[1],m[2]);t=t.replace(m[0]," ");break}}
  const stop=/^(add|new|customer|named?|called|mobile|mob|number|no|phone|tel|ph|owes?|due|amount|balance|baki|baaki|udhaar|udhar|rupees?|rupaye|rs|inr|collect|collection|payment|pay|by|from|is|has|have|to|ki|ka|ke|ko|hai|se|the|of|a|please|and|send|link|right|now|today|immediately|abhi|aaj|total|date|khata|entry|tak|me|mein|his|her|for|with|on)$/i;
  const lab=t.match(/(?:name|customer)\s*[:\-]\s*([A-Za-z .]+)/i);
  const src=lab?[lab[1]]:t.split(/\n/);
  for(const line of src){const w=line.replace(/[^A-Za-z.\s]/g," ").split(/\s+/).filter(x=>x.replace(/\./g,"").length>0&&!stop.test(x.replace(/\./g,"")));
    if(w.length){out.name=w.slice(0,4).map(x=>x[0].toUpperCase()+x.slice(1)).join(" ");break}}
  return out;
}

function chart(){
  const days=[...Array(7)].map((_,i)=>{const d=today-(6-i)*DAY;return{d,v:collected(d,d+DAY).reduce((a,p)=>a+p.amt,0)}});
  const mx=Math.max(...days.map(x=>x.v),1);
  const mag=Math.pow(10,Math.floor(Math.log10(mx)));
  const top=[1,2,2.5,5,10].map(k=>k*mag).find(k=>k>=mx);
  const W=340,H=150,L=38,B=22,T=6,plot=H-B-T,cw=(W-L)/7;
  const y=v=>T+plot-(v/top)*plot;
  const lab=v=>v===0?"₹0":"₹"+(v/1e5).toLocaleString("en-IN",{maximumFractionDigits:1})+"k";
  let g="";[0,.5,1].forEach(k=>{const v=top*k,yy=y(v);g+=`<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${lab(v)}</text>`});
  days.forEach((x,i)=>{
    const cx=L+cw*i+cw/2,bw=20,yy=y(x.v),h=T+plot-yy,rad=Math.min(4,h);
    if(h>0)g+=`<path d="M${cx-bw/2} ${T+plot}V${yy+rad}Q${cx-bw/2} ${yy} ${cx-bw/2+rad} ${yy}H${cx+bw/2-rad}Q${cx+bw/2} ${yy} ${cx+bw/2} ${yy+rad}V${T+plot}Z" fill="${i===chartSel?"var(--bar)":"var(--bar-dim)"}"/>`;
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${new Date(x.d).toLocaleDateString("en-IN",{weekday:"short"})}</text>`;
    g+=`<rect x="${L+cw*i}" y="0" width="${cw}" height="${H}" fill="transparent" style="cursor:pointer" data-act="bar" data-i="${i}" role="button" tabindex="0" aria-label="${fDate(x.d)}: ${money(x.v)}"/>`;
  });

function parseCsv(t){const R=[];let c="",row=[],q=false;t=t.replace(/^﻿/,"");for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=h}else if(h==='"')q=true;else if(h===","){row.push(c);c=""}else if(h==="\n"){row.push(c);R.push(row);row=[];c=""}else if(h!=="\r")c+=h}if(c||row.length){row.push(c);R.push(row)}return R.filter(r=>r.some(x=>x.trim()))}

  const iD=col("date"),iR=col("utr","ref","transaction id","txn");let ok=0,skip=0;

    R.slice(1).forEach(r=>{const at=parseDate(r[iD]),a=rupees(r[iC]);if(!isFinite(at)||!(a>0)){skip++;return}const ref=iR>=0?r[iR].trim():"";if(ref&&bank.some(b=>b.ref===ref)){skip++;return}bank.push({at,desc:iDs>=0?r[iDs].trim():"Bank credit",ref,amt:a});ok++})}

function qrSvg(){
  const n=29,R=rngFrom(77);let c="";

  const inF=(x,y)=>(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!inF(x,y)&&R()>.52)c+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;

  csv:()=>{const st=statement(),q=s=>'"'+String(s).replace(/"/g,'""')+'"',rs=n=>(n/100).toFixed(2);
    const out=[["Merchant Pay prototype, sample data"],["MK"],["Period",fDate(st.a),fDate(st.b-1)],["Opening balance",rs(st.open)],[],["Date","Time","Entry","Details","Reference","Debit","Credit","Balance"]];
    st.rows.forEach(e=>out.push([fDate(e.at),fTime(e.at),e.kind,e.detail,e.ref,e.amt<0?rs(-e.amt):"",e.amt>0?rs(e.amt):"",rs(e.bal)]));
    out.push([],["Closing balance",rs(st.close)]);
    const text="\ufeff"+out.map(r=>r.map(q).join(",")).join("\r\n"),name="merchant-pay-statement-"+iso(st.a)+"-to-"+iso(st.b-1)+".csv";
    (async()=>{const FN=name,dl=(window.claude)&&await window.claude.use("downloads");if(!dl){const u_=URL.createObjectURL(new Blob([text],{type:"text/csv"})),a_=document.createElement("a");a_.href=u_;a_.download=FN;document.body.appendChild(a_);a_.click();a_.remove();setTimeout(()=>URL.revokeObjectURL(u_),2000);toast("File saved");return}
      try{await dl.save({filename:name,data:new Blob([text],{type:"text/csv"})});toast("Statement saved")}catch(e){toast(e&&e.code==="declined"?"Download cancelled":"The statement couldn't be saved")}})()}
};

  if(e.target.classList&&e.target.classList.contains("optT")){const c=crm.find(x=>x.id===e.target.dataset.id);c.optIn=e.target.checked;S.sheet={type:"crmC",id:c.id};render(true)}
  if(e.target.id==="rcFile"){const inp=e.target,t=inp.dataset.t,res=$("#rcRes"),show=(m,bad)=>{res.innerHTML=`<div class="${bad?"err":"info"}">${esc(m)}</div>`};const file=inp.files[0];if(!file)return;
    const nm=t==="partner"?$("#rcName").value.trim():"";if(t==="partner"&&!nm){show("Enter the partner name first.",true);inp.value="";return}
    const fr=new FileReader();fr.onerror=()=>show("This file couldn't be read.",true);fr.onload=()=>{const out=importCsv(String(fr.result),t,nm);inp.value="";if(out.err){show(out.err,true);return}if(!out.ok){show("No new rows were added. "+out.skip+" rows were duplicates or missing a date or amount.",true);return}render(true);const r=$("#rcRes");if(r)r.innerHTML=`<div class="info">${out.ok} row${out.ok>1?"s":""} added${out.skip?", "+out.skip+" skipped":""}. Your single view is updated.</div>`};fr.readAsText(file)}if(e.target.classList&&e.target.classList.contains("scFile")){readPhoto(e.target.files[0]);e.target.value=""}if(e.target.id==="bkAll"){document.querySelectorAll(".bk:not([disabled])").forEach(x=>x.checked=e.target.checked);bulkSync()}if(e.target.classList&&e.target.classList.contains("bk"))bulkSync();if(e.target.id==="dfrom"){S.from=e.target.value;render(true)}if(e.target.id==="dto"){S.to=e.target.value;render(true)}});
